
[build]
  command = "npx base44 build"
  publish = "dist"

# The Base44 app this site belongs to. `base44 build` reads it to inject the app
# id, since base44/.app.jsonc (written by `base44 link`) is gitignored.
[build.environment]
  BASE44_APP_ID = "6ad84692ebac5a469373d0ee"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
